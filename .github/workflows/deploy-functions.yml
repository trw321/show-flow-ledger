name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Test token access
        run: |
          echo "Testing API access..."
          curl -s -w "\nHTTP %{http_code}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
            "https://api.supabase.com/v1/projects/yuoculbvburpdmgwjcem/functions" | tail -3
      - uses: supabase/setup-cli@v1
        with:
          version: 1.207.9
      - run: supabase functions deploy parse-jobs --project-ref yuoculbvburpdmgwjcem
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
